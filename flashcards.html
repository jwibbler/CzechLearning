<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards — Czech Practice</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: #f1f5f9; min-height: 100vh; padding: 24px 20px; }
header { display: flex; align-items: center; gap: 16px; max-width: 680px; margin: 0 auto 28px; }
header a { color: #3b82f6; text-decoration: none; font-size: 0.9rem; }
header h1 { font-size: 1.4rem; color: #1e293b; }

.controls { max-width: 680px; margin: 0 auto 20px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filter-btn {
  padding: 6px 14px; border-radius: 20px; border: 2px solid #e2e8f0;
  background: white; cursor: pointer; font-size: 0.85rem; color: #475569; transition: all 0.15s;
}
.filter-btn.active { background: #3b82f6; border-color: #3b82f6; color: white; }
.filter-btn:hover:not(.active) { border-color: #3b82f6; color: #3b82f6; }
.action-btn {
  padding: 6px 14px; border-radius: 8px; border: none;
  background: #e2e8f0; cursor: pointer; font-size: 0.85rem; color: #475569;
  transition: background 0.15s; margin-left: auto;
}
.action-btn:hover { background: #cbd5e1; }
.direction-toggle {
  padding: 6px 14px; border-radius: 8px; border: 2px solid #e2e8f0;
  background: white; cursor: pointer; font-size: 0.85rem; color: #475569; transition: all 0.15s;
}
.direction-toggle.active { background: #7c3aed; border-color: #7c3aed; color: white; }

.progress-bar-wrap { max-width: 680px; margin: 0 auto 24px; }
.progress-info { display: flex; justify-content: space-between; font-size: 0.8rem; color: #64748b; margin-bottom: 6px; }
.progress-bar { height: 6px; background: #e2e8f0; border-radius: 3px; }
.progress-fill { height: 100%; background: #3b82f6; border-radius: 3px; transition: width 0.3s; }

.scene { max-width: 680px; margin: 0 auto; perspective: 1200px; cursor: pointer; user-select: none; }
.card-wrap {
  position: relative; width: 100%; height: 400px;
  transform-style: preserve-3d; transition: transform 0.45s ease;
}
.card-wrap.flipped { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; background: white; border-radius: 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.1);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 20px 32px; backface-visibility: hidden; gap: 0;
}
.face.back { transform: rotateY(180deg); background: #f8faff; }

/* Visual (emoji) */
.card-visual {
  width: 150px; height: 150px; border-radius: 20px; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  font-size: 90px; line-height: 1;
  margin-bottom: 14px; flex-shrink: 0;
}
.card-visual.small {
  width: 72px; height: 72px; font-size: 44px; margin-bottom: 10px; border-radius: 12px;
}

.face .label {
  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: #94a3b8; margin-bottom: 6px;
}
.face .word { font-size: 1.55rem; font-weight: 600; color: #1e293b; text-align: center; line-height: 1.3; }
.face .hint { font-size: 0.82rem; color: #94a3b8; margin-top: 10px; }
.face .category-tag {
  position: absolute; top: 14px; right: 14px;
  font-size: 0.7rem; font-weight: 600; padding: 3px 10px;
  border-radius: 12px; background: #e0e7ff; color: #4338ca; text-transform: capitalize;
}

.nav { max-width: 680px; margin: 20px auto 0; display: flex; align-items: center; gap: 12px; justify-content: center; }
.nav-btn {
  padding: 10px 28px; border-radius: 8px; border: 2px solid #e2e8f0;
  background: white; cursor: pointer; font-size: 0.95rem; color: #1e293b;
  font-weight: 500; transition: all 0.15s;
}
.nav-btn:hover { border-color: #3b82f6; color: #3b82f6; }
.nav-btn:disabled { opacity: 0.35; cursor: default; }
.got-it-btn {
  padding: 10px 28px; border-radius: 8px; border: none;
  background: #22c55e; cursor: pointer; font-size: 0.95rem; color: white;
  font-weight: 500; transition: background 0.15s;
}
.got-it-btn:hover { background: #16a34a; }
.still-btn {
  padding: 10px 28px; border-radius: 8px; border: none;
  background: #f97316; cursor: pointer; font-size: 0.95rem; color: white;
  font-weight: 500; transition: background 0.15s;
}
.still-btn:hover { background: #ea580c; }
.known-count { max-width: 680px; margin: 16px auto 0; text-align: center; font-size: 0.85rem; color: #64748b; }
</style>
</head>
<body>
<header>
  <a href="index.html">← Back</a>
  <h1>Flashcards</h1>
</header>

<div class="controls" id="controls"></div>

<div class="progress-bar-wrap">
  <div class="progress-info">
    <span id="progress-text">Card 1 of 0</span>
    <span id="known-text">Known: 0</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
</div>

<div class="scene" onclick="flipCard()">
  <div class="card-wrap" id="card-wrap">
    <div class="face front">
      <div class="card-visual" id="front-visual"></div>
      <div class="label" id="front-label">Czech</div>
      <div class="word" id="front-word"></div>
      <div class="hint">Click to reveal</div>
      <div class="category-tag" id="cat-tag"></div>
    </div>
    <div class="face back">
      <div class="card-visual small" id="back-visual"></div>
      <div class="label" id="back-label">English</div>
      <div class="word" id="back-word"></div>
      <div class="category-tag" id="cat-tag-back"></div>
    </div>
  </div>
</div>

<div class="nav">
  <button class="nav-btn" onclick="prevCard()">Prev</button>
  <button class="still-btn" onclick="markCard(false)">Still learning</button>
  <button class="got-it-btn" onclick="markCard(true)">Got it</button>
  <button class="nav-btn" onclick="nextCard()">Next</button>
</div>
<div class="known-count" id="known-count"></div>

<script src="data.js"></script>
<script>
const CATEGORIES = ['all','body','health','food','countries','verbs','phrases','time','plurals','past_tense','cases','adjectives','aspect','connectors','negation'];
const LABELS = { all:'All', body:'Body', health:'Health', food:'Food', countries:'Countries', verbs:'Verbs', phrases:'Phrases', time:'Time', plurals:'Plurals', past_tense:'Past Tense', cases:'Cases', adjectives:'Adjectives', aspect:'Aspect', connectors:'Connectors', negation:'Negation' };

  "polévka":"🍲","česnek":"🧄","pažitka":"🌿","kari":"🍛",

  "výborný":"⭐","chutný":"😋","restaurace":"🍴","jídelní lístek":"📋","poledni menu":"🍽️",
  // Verbs
  "dívat se":"👁️","podívat se":"🔍","brát":"✋","vařit":"🍳",
  "milovat":"❤️","mít rád":"👍","koupit":"🛒","kupovat":"🛒",
  "nosit":"👗","číst":"📖","chodit":"🚶","jít":"🚶","jet":"🚗",
  "přijít":"🚪","přijet":"🚂","jíst":"🍽️","pít":"🥤",

  "ráno":"🌅","dopoledne":"☀️","odpoledne":"🌤️","večer":"🌆",

  "půl deváté":"🕗","půl osmé":"🕣",

  "ale":"↔️","protože":"🔗","proto":"➡️","tak":"👉",

  "nic":"🚫","nikde":"📍","nikam":"🚫","nikdo":"👤",

  "Nikdy nic nejím.":"❌","Chtěl/a bych...":"🙏",

  "dobrý / dobrá / dobré":"👍","velký / velká / velké":"📏",
  "malý / malá / malé":"🤏","nový / nová / nové":"✨",

  "rychlý / rychlá / rychlé":"⚡","pomalý / pomalá / pomalé":"🐢",
  "zajímavý / zajímavá / zajímavé":"🤔","nudný / nudná / nudné":"😐",

  "koupit / kupovat":"🛒","přijít / přicházet":"🚪","odejít / odcházet":"🚶",
  "uvařit / vařit":"🍳","napsat / psát":"✍️","přečíst / číst":"📖",

  "říct / říkat":"💬","vzít / brát":"✋","podívat se / dívat se":"👁️",
  "sníst / jíst":"🍽️","vypít / pít":"🥤",
  // Past tense
  "byl / byla":"⏪","měl / měla":"🤲","šel / šla":"🚶","jel / jela":"🚗",
  "jedl / jedla":"🍽️","pil / pila":"🥤","chtěl / chtěla":"💭",
  "mohl / mohla":"💪","musel / musela":"❗","viděl / viděla":"👁️",
  "slyšel / slyšela":"👂","četl / četla":"📖","psal / psala":"✍️",
  "vařil / vařila":"🍳","mluvil / mluvila":"💬","pracoval / pracovala":"💼",
  "dělal / dělala":"🔧","přišel / přišla":"🚪","přijel / přijela":"🚗",
  "byl jsem / byla jsem":"⏪","šel jsem / šla jsem":"🚶","viděl jsem / viděla jsem":"👁️",
  // Plurals
  "doktoři":"👨‍⚕️","lékaři":"👨‍⚕️","bratři":"👨‍👦","sestry":"👩‍👧",
  "auta":"🚗","obědy":"🍽️","ženy":"👩","muži":"👨","děti":"👧",
  "přátelé":"👥","studenti":"🎓","učitelé":"👨‍🏫",
  // Phrases
  "Bolí mě záda.":"😣","Bolí mě hlava.":"🤕","Kde tě bolí?":"🤕",
  "U doktora.":"🏥","K doktorovi.":"🏥","Jsi nemocný?":"🤒",
  "Mám nachlazení.":"🤧","Mám chřipku.":"🤒","Cítím se špatně.":"😔",
  "Mám hlad.":"🍽️","Mám žízeň.":"💧","Máš hlad?":"🍽️",
  "Dám si...":"👉","Účet prosím.":"💳","Je to výborné.":"⭐","Je to moc ostré.":"🌶️",
  "Co doporučujete?":"📋","Jak chutná?":"😋",
};

// Category fallback emoji (shown when no specific entry exists)
const CAT_EMOJI = {
  body:'🫀', health:'💊', food:'🍽️', countries:'🌍', verbs:'▶️',
  phrases:'💬', time:'⏰', plurals:'🔢', past_tense:'⏪',
  cases:'📐', adjectives:'🎨', aspect:'🔄', connectors:'🔗', negation:'❌'
};

function getEmoji(card) {
  return EMOJI_MAP[card.czech] || CAT_EMOJI[card.category] || '📖';
}

// Category background colours for the visual box
const CAT_BG = {
  body:'#fce7f3', health:'#dbeafe', food:'#fef9c3', countries:'#dcfce7',
  verbs:'#ede9fe', phrases:'#e0f2fe', time:'#fef3c7', plurals:'#f0fdf4',
  past_tense:'#fce7f3', cases:'#f1f5f9', adjectives:'#fdf4ff',
  aspect:'#ecfdf5', connectors:'#fff7ed', negation:'#fee2e2'
};

// ── Flashcard logic ──────────────────────────────────────────────

let activeCategory = 'all';
let czechFirst = true;
let deck = [];
let current = 0;
let known = new Set();
let flipped = false;

function buildDeck() {
  deck = VOCAB.filter(v => activeCategory === 'all' || v.category === activeCategory);
  current = 0;
  flipped = false;
  showCard();
}

function shuffle() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  current = 0;
  flipped = false;
  document.getElementById('card-wrap').classList.remove('flipped');
  showCard();
}

function showCard() {
  if (deck.length === 0) return;
  const card = deck[current];

  const frontWord = czechFirst ? card.czech : card.english;
  const backWord  = czechFirst ? card.english : card.czech;

  document.getElementById('front-word').textContent  = frontWord;
  document.getElementById('back-word').textContent   = backWord;
  document.getElementById('front-label').textContent = czechFirst ? 'Czech' : 'English';
  document.getElementById('back-label').textContent  = czechFirst ? 'English' : 'Czech';
  document.getElementById('cat-tag').textContent     = card.category.replace('_', ' ');
  document.getElementById('cat-tag-back').textContent = card.category.replace('_', ' ');

  const em = getEmoji(card);
  const bg = CAT_BG[card.category] || '#f1f5f9';
  const fv = document.getElementById('front-visual');
  const bv = document.getElementById('back-visual');
  fv.textContent = em;  fv.style.background = bg;
  bv.textContent = em;  bv.style.background = bg;

  const fill = deck.length > 1 ? (current / (deck.length - 1)) * 100 : 100;
  document.getElementById('progress-fill').style.width = fill + '%';
  document.getElementById('progress-text').textContent = `Card ${current + 1} of ${deck.length}`;
  document.getElementById('known-text').textContent = `Known: ${known.size}`;
  document.getElementById('known-count').textContent =
    known.size > 0 ? `${known.size} of ${VOCAB.length} total cards marked as known` : '';
}

function flipCard() {
  flipped = !flipped;
  document.getElementById('card-wrap').classList.toggle('flipped', flipped);
}

function nextCard() {
  if (current < deck.length - 1) { current++; resetFlip(); showCard(); }
}

function prevCard() {
  if (current > 0) { current--; resetFlip(); showCard(); }
}

function resetFlip() {
  flipped = false;
  document.getElementById('card-wrap').classList.remove('flipped');
}

function markCard(isKnown) {
  const card = deck[current];
  if (isKnown) known.add(card.czech);
  else known.delete(card.czech);
  if (current < deck.length - 1) current++;
  resetFlip();
  showCard();
}

function setCategory(cat) {
  activeCategory = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  buildDeck();
}

function buildControls() {
  const div = document.getElementById('controls');
  CATEGORIES.forEach(cat => {
    const b = document.createElement('button');
    b.className = 'filter-btn' + (cat === 'all' ? ' active' : '');
    b.dataset.cat = cat;
    b.textContent = LABELS[cat];
    b.onclick = () => setCategory(cat);
    div.appendChild(b);
  });

  const shuffleBtn = document.createElement('button');
  shuffleBtn.className = 'action-btn';
  shuffleBtn.textContent = 'Shuffle';
  shuffleBtn.onclick = shuffle;
  div.appendChild(shuffleBtn);

  const dirBtn = document.createElement('button');
  dirBtn.className = 'direction-toggle';
  dirBtn.textContent = 'Czech → English';
  dirBtn.onclick = () => {
    czechFirst = !czechFirst;
    dirBtn.textContent = czechFirst ? 'Czech → English' : 'English → Czech';
    dirBtn.classList.toggle('active', !czechFirst);
    resetFlip();
    showCard();
  };
  div.appendChild(dirBtn);
}

buildControls();
buildDeck();
</script>
</body>
</html>
