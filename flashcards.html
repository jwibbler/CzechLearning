<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>Flashcards — Czech Practice</title>
<style>
.card-wrap {
  position: relative;
  width: 100%;
  perspective: 1200px;
  cursor: pointer;
  user-select: none;
  margin-bottom: 12px;
}
.card-inner {
  position: relative;
  width: 100%;
  min-height: 190px;
  transform-style: preserve-3d;
  transition: transform 0.45s ease;
}
.card-inner.flipped { transform: rotateY(180deg); }

.face {
  position: absolute;
  inset: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 28px 24px;
  backface-visibility: hidden;
  gap: 8px;
  text-align: center;
  min-height: 190px;
}
.face.back {
  transform: rotateY(180deg);
  background: var(--surface2);
}
.face .cat-tag { position: absolute; top: 12px; right: 12px; }
.face .label-sm { margin-bottom: 2px; }
.face .word {
  font-size: 1.65rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text);
  line-height: 1.25;
}
.face .hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

.card-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 8px;
}
.card-actions .action-row,
.card-actions .nav-row {
  display: flex;
  gap: 8px;
}
.card-actions .action-row .btn,
.card-actions .nav-row .btn {
  flex: 1;
}
.known-count {
  text-align: center;
  font-size: 0.78rem;
  color: var(--text-muted);
  min-height: 20px;
}

/* direction toggle in chip-row */
.dir-chip {
  margin-left: auto;
  padding: 4px 12px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  font-size: 0.76rem;
  font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s;
}
.dir-chip.active { background: #7c3aed; border-color: #7c3aed; color: white; }
.dir-chip:hover:not(.active) { border-color: #7c3aed; color: #7c3aed; }
</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">🇨🇿 Czech Practice</a>
  <a href="flashcards.html" class="nav-link active">Flashcards</a>
  <a href="matching.html" class="nav-link">Matching</a>
  <a href="quiz.html" class="nav-link">Quiz</a>
  <button class="theme-btn" id="theme-btn" onclick="toggleTheme()">☀️</button>
</nav>

<div class="page">
  <div class="chip-row" id="chip-row"></div>

  <div class="progress-row">
    <span id="progress-text">Card 1 of 0</span>
    <span id="known-text">Known: 0</span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>

  <div class="card-wrap" onclick="flipCard()">
    <div class="card-inner" id="card-inner">
      <div class="face front">
        <span class="cat-tag" id="cat-tag"></span>
        <div class="label-sm" id="front-label">Czech</div>
        <div class="word" id="front-word"></div>
        <div class="hint">Tap to reveal</div>
      </div>
      <div class="face back">
        <span class="cat-tag" id="cat-tag-back"></span>
        <div class="label-sm" id="back-label">English</div>
        <div class="word" id="back-word"></div>
      </div>
    </div>
  </div>

  <div class="card-actions">
    <div class="action-row">
      <button class="btn btn-warning" onclick="markCard(false)">Still learning</button>
      <button class="btn btn-success" onclick="markCard(true)">Got it ✓</button>
    </div>
    <div class="nav-row">
      <button class="btn" onclick="prevCard()">← Prev</button>
      <button class="btn" onclick="nextCard()">Next →</button>
    </div>
  </div>
  <div class="known-count" id="known-count"></div>
</div>

<script src="data.js"></script>
<script>
(function() {
  const saved = localStorage.getItem('theme') || 'dark';
  document.documentElement.dataset.theme = saved;
  document.getElementById('theme-btn').textContent = saved === 'dark' ? '☀️' : '🌙';
})();
function toggleTheme() {
  const html = document.documentElement;
  const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
  html.dataset.theme = next;
  localStorage.setItem('theme', next);
  document.getElementById('theme-btn').textContent = next === 'dark' ? '☀️' : '🌙';
}

const CATEGORIES = ['all','body','health','food','countries','verbs','phrases','time','plurals','past_tense','cases','adjectives','aspect','connectors','negation'];
const LABELS = { all:'All', body:'Body', health:'Health', food:'Food', countries:'Countries', verbs:'Verbs', phrases:'Phrases', time:'Time', plurals:'Plurals', past_tense:'Past Tense', cases:'Cases', adjectives:'Adjectives', aspect:'Aspect', connectors:'Connectors', negation:'Negation' };

let activeCategory = 'all';
let czechFirst = true;
let deck = [];
let current = 0;
let known = new Set();
let flipped = false;

function buildDeck() {
  deck = VOCAB.filter(v => activeCategory === 'all' || v.category === activeCategory);
  current = 0;
  flipped = false;
  showCard();
}

function shuffle() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  current = 0;
  flipped = false;
  document.getElementById('card-inner').classList.remove('flipped');
  showCard();
}

function showCard() {
  if (deck.length === 0) return;
  const card = deck[current];
  const frontWord = czechFirst ? card.czech : card.english;
  const backWord  = czechFirst ? card.english : card.czech;

  document.getElementById('front-word').textContent  = frontWord;
  document.getElementById('back-word').textContent   = backWord;
  document.getElementById('front-label').textContent = czechFirst ? 'Czech' : 'English';
  document.getElementById('back-label').textContent  = czechFirst ? 'English' : 'Czech';
  document.getElementById('cat-tag').textContent     = card.category.replace('_', ' ');
  document.getElementById('cat-tag-back').textContent = card.category.replace('_', ' ');

  const fill = deck.length > 1 ? (current / (deck.length - 1)) * 100 : 100;
  document.getElementById('progress-fill').style.width = fill + '%';
  document.getElementById('progress-text').textContent = `Card ${current + 1} of ${deck.length}`;
  document.getElementById('known-text').textContent = `Known: ${known.size}`;
  document.getElementById('known-count').textContent =
    known.size > 0 ? `${known.size} of ${VOCAB.length} total marked as known` : '';
}

function flipCard() {
  flipped = !flipped;
  document.getElementById('card-inner').classList.toggle('flipped', flipped);
}

function nextCard() {
  if (current < deck.length - 1) { current++; resetFlip(); showCard(); }
}

function prevCard() {
  if (current > 0) { current--; resetFlip(); showCard(); }
}

function resetFlip() {
  flipped = false;
  document.getElementById('card-inner').classList.remove('flipped');
}

function markCard(isKnown) {
  const card = deck[current];
  if (isKnown) known.add(card.czech); else known.delete(card.czech);
  if (current < deck.length - 1) current++;
  resetFlip();
  showCard();
}

function setCategory(cat) {
  activeCategory = cat;
  document.querySelectorAll('.chip[data-cat]').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  buildDeck();
}

function buildControls() {
  const row = document.getElementById('chip-row');
  CATEGORIES.forEach(cat => {
    const b = document.createElement('button');
    b.className = 'chip' + (cat === 'all' ? ' active' : '');
    b.dataset.cat = cat;
    b.textContent = LABELS[cat];
    b.onclick = () => setCategory(cat);
    row.appendChild(b);
  });

  const shuffleBtn = document.createElement('button');
  shuffleBtn.className = 'btn btn-ghost';
  shuffleBtn.style.cssText = 'font-size:0.76rem;padding:4px 12px;border-radius:20px;';
  shuffleBtn.textContent = 'Shuffle';
  shuffleBtn.onclick = shuffle;
  row.appendChild(shuffleBtn);

  const dirBtn = document.createElement('button');
  dirBtn.className = 'dir-chip';
  dirBtn.textContent = 'Czech → English';
  dirBtn.onclick = () => {
    czechFirst = !czechFirst;
    dirBtn.textContent = czechFirst ? 'Czech → English' : 'English → Czech';
    dirBtn.classList.toggle('active', !czechFirst);
    resetFlip();
    showCard();
  };
  row.appendChild(dirBtn);
}

buildControls();
buildDeck();
</script>
</body>
</html>
