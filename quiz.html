<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>Quiz — Czech Practice</title>
<style>
.controls-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 8px;
  align-items: center;
}
.section-label {
  font-size: 0.67rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-right: 2px;
  align-self: center;
}
.mode-chip {
  padding: 4px 12px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  font-size: 0.76rem;
  font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s;
}
.mode-chip.active { background: var(--warning); border-color: var(--warning); color: white; }
.mode-chip:hover:not(.active) { border-color: var(--warning); color: var(--warning); }

.score-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.score-display { font-size: 0.82rem; color: var(--text-muted); }
.score-display strong { color: var(--text); }

/* Quiz card */
.quiz-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow);
}
.question-label {
  font-size: 0.67rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 10px;
}
.question-text {
  font-size: 1.7rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
  line-height: 1.25;
  letter-spacing: -0.02em;
}
.question-sub { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 20px; }

.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
@media (max-width: 480px) { .options { grid-template-columns: 1fr; } }

.opt-btn {
  padding: 12px 14px;
  border-radius: 9px;
  border: 1.5px solid var(--border);
  background: var(--surface2);
  cursor: pointer;
  font-size: 0.88rem;
  color: var(--text);
  text-align: left;
  line-height: 1.35;
  transition: border-color 0.15s, background 0.15s;
}
.opt-btn:hover:not(:disabled) { border-color: var(--warning); background: var(--accent-light); }
.opt-btn.correct { border-color: var(--success); background: var(--success-bg); color: var(--success); }
.opt-btn.wrong   { border-color: var(--danger);  background: var(--danger-bg);  color: var(--danger); }
.opt-btn:disabled { cursor: default; }

.feedback { margin-top: 14px; font-size: 0.88rem; min-height: 20px; }
.feedback.correct { color: var(--success); }
.feedback.wrong   { color: var(--danger); }

.next-btn {
  margin-top: 16px;
  display: none;
}

/* Done screen */
.done-msg { text-align: center; padding: 32px 16px; }
.done-msg h2 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 6px; }
.done-msg p { color: var(--text-muted); margin-bottom: 20px; font-size: 0.9rem; }
.wrong-list { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; text-align: left; }
.wrong-item {
  background: var(--danger-bg);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 10px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.85rem;
}
.wrong-item .missed { color: var(--danger); font-size: 0.78rem; }

/* Conjugation mode */
.conj-intro { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; }
.conj-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
.conj-table th {
  font-size: 0.67rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-muted); text-align: left; padding: 8px 12px;
  border-bottom: 1px solid var(--border);
}
.conj-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 0.88rem; color: var(--text); }
.conj-table td:first-child { font-weight: 600; color: var(--text-muted); width: 90px; }
.fill-input {
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 7px 11px;
  font-size: 0.88rem;
  width: 100%;
  max-width: 200px;
  outline: none;
  background: var(--bg);
  color: var(--text);
  transition: border-color 0.15s;
}
.fill-input:focus { border-color: var(--accent); }
.fill-input.correct { border-color: var(--success); background: var(--success-bg); }
.fill-input.wrong   { border-color: var(--danger);  background: var(--danger-bg); }
.conj-actions { display: flex; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">🇨🇿 Czech Practice</a>
  <a href="flashcards.html" class="nav-link">Flashcards</a>
  <a href="matching.html" class="nav-link">Matching</a>
  <a href="quiz.html" class="nav-link active">Quiz</a>
  <button class="theme-btn" id="theme-btn" onclick="toggleTheme()">☀️</button>
</nav>

<div class="page">
  <div class="controls-row" id="controls">
    <span class="section-label">Mode</span>
    <button class="mode-chip active" data-mode="cz-en" onclick="setMode('cz-en', this)">Czech → English</button>
    <button class="mode-chip" data-mode="en-cz" onclick="setMode('en-cz', this)">English → Czech</button>
    <button class="mode-chip" data-mode="conj" onclick="setMode('conj', this)">Conjugations</button>
  </div>

  <div class="filter-header" id="cat-filter-header">
    <button class="filter-toggle-btn" id="filter-toggle-btn" onclick="toggleFilters()">
      Topics: <span id="filter-label">All</span> <span class="arrow" id="filter-arrow">▾</span>
    </button>
  </div>
  <div class="chip-row" id="cat-controls" style="display:none"></div>

  <div class="score-row" id="score-row">
    <div class="score-display" id="score-display">Score: <strong>0</strong> / 0</div>
    <button class="btn btn-ghost" onclick="restart()">Restart</button>
  </div>

  <div class="quiz-card" id="card-area"></div>
</div>

<script src="data.js"></script>
<script>
(function() {
  const saved = localStorage.getItem('theme') || 'dark';
  document.documentElement.dataset.theme = saved;
  document.getElementById('theme-btn').textContent = saved === 'dark' ? '☀️' : '🌙';
})();
function toggleTheme() {
  const html = document.documentElement;
  const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
  html.dataset.theme = next;
  localStorage.setItem('theme', next);
  document.getElementById('theme-btn').textContent = next === 'dark' ? '☀️' : '🌙';
}

const CATEGORIES = ['all','body','health','food','countries','verbs','phrases','time','plurals','past_tense','cases','adjectives','aspect','connectors','negation'];
const LABELS = { all:'All', body:'Body', health:'Health', food:'Food', countries:'Countries', verbs:'Verbs', phrases:'Phrases', time:'Time', plurals:'Plurals', past_tense:'Past Tense', cases:'Cases', adjectives:'Adjectives', aspect:'Aspect', connectors:'Connectors', negation:'Negation' };

let mode = 'cz-en';
let activeCategory = 'all';
let pool = [];
let weights = {};
let currentIndex = -1;
let score = 0;
let sessionCount = 0;
const SESSION_TARGET = 20;
let answered = false;
let activeVerbIndex = 0;
let wrongItems = {};

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildDeck() {
  pool = VOCAB.filter(v => activeCategory === 'all' || v.category === activeCategory);
  weights = {};
  pool.forEach((_, i) => { weights[i] = 3; });
  currentIndex = -1; score = 0; sessionCount = 0; answered = false; wrongItems = {};
}

function pickNext() {
  if (pool.length === 1) return 0;
  let total = 0;
  pool.forEach((_, i) => { if (i !== currentIndex) total += weights[i]; });
  let r = Math.random() * total;
  for (let i = 0; i < pool.length; i++) {
    if (i === currentIndex) continue;
    r -= weights[i];
    if (r <= 0) return i;
  }
  return pool.findIndex((_, i) => i !== currentIndex);
}

function getDistractors(correct, field) {
  const candidates = VOCAB.filter(v => {
    const val = v[field];
    return val !== correct && (activeCategory === 'all' || v.category === activeCategory);
  });
  const shuffled = shuffle(candidates);
  const chosen = [];
  for (const v of shuffled) {
    if (!chosen.includes(v[field])) { chosen.push(v[field]); if (chosen.length === 3) break; }
  }
  while (chosen.length < 3) {
    const fallback = shuffle(VOCAB).find(v => v[field] !== correct && !chosen.includes(v[field]));
    if (fallback) chosen.push(fallback[field]); else break;
  }
  return chosen;
}

function renderQuestion() {
  const card = document.getElementById('card-area');
  if (sessionCount >= SESSION_TARGET) { renderDone(); return; }
  currentIndex = pickNext();
  const item = pool[currentIndex];
  answered = false;

  const questionField = mode === 'cz-en' ? 'czech' : 'english';
  const answerField   = mode === 'cz-en' ? 'english' : 'czech';
  const questionLang  = mode === 'cz-en' ? 'Czech' : 'English';
  const answerLang    = mode === 'cz-en' ? 'English' : 'Czech';

  const correct = item[answerField];
  const distractors = getDistractors(correct, answerField);
  const options = shuffle([correct, ...distractors]);

  const w = weights[currentIndex];
  const diffDot = w >= 7 ? '<span style="color:var(--danger);font-size:0.72rem;margin-left:8px">needs practice</span>'
                : w <= 1 ? '<span style="color:var(--success);font-size:0.72rem;margin-left:8px">looking good</span>'
                : '';

  card.innerHTML = `
    <div class="question-label">${questionLang}${diffDot}</div>
    <div class="question-text">${item[questionField]}</div>
    <div class="question-sub">What is the ${answerLang.toLowerCase()}?</div>
    <div class="options" id="options">
      ${options.map(opt => `<button class="opt-btn" onclick="checkAnswer(this, '${esc(opt)}', '${esc(correct)}')">${opt}</button>`).join('')}
    </div>
    <div class="feedback" id="feedback"></div>
    <button class="btn btn-primary next-btn" id="next-btn" onclick="nextQuestion()">Next question →</button>
  `;
  updateScore();
}

function esc(s) { return s.replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

function checkAnswer(btn, chosen, correct) {
  if (answered) return;
  answered = true;
  sessionCount++;
  const fb = document.getElementById('feedback');
  document.querySelectorAll('.opt-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent.trim() === correct) b.classList.add('correct');
  });
  if (chosen === correct) {
    btn.classList.add('correct');
    fb.textContent = 'Correct!';
    fb.className = 'feedback correct';
    score++;
    weights[currentIndex] = Math.max(1, weights[currentIndex] - 1);
    updateScore();
    setTimeout(nextQuestion, 1600);
  } else {
    btn.classList.add('wrong');
    fb.textContent = `Not quite — the answer is: ${correct}`;
    fb.className = 'feedback wrong';
    weights[currentIndex] += 3;
    if (!wrongItems[currentIndex]) wrongItems[currentIndex] = { item: pool[currentIndex], count: 0 };
    wrongItems[currentIndex].count++;
    document.getElementById('next-btn').style.display = 'inline-block';
    updateScore();
  }
}

function nextQuestion() { renderQuestion(); }

function renderDone() {
  const pct = Math.round((score / SESSION_TARGET) * 100);
  const hardList = Object.values(wrongItems).sort((a, b) => b.count - a.count).slice(0, 8);

  const hardHTML = hardList.length === 0
    ? '<p style="color:var(--success);margin-bottom:16px">No mistakes this round — great work!</p>'
    : '<p style="color:var(--text-muted);margin-bottom:10px;font-size:0.85rem">Keep practising these:</p><ul class="wrong-list">' +
      hardList.map(e => `
        <li class="wrong-item">
          <span><strong>${e.item.czech}</strong> — ${e.item.english}</span>
          <span class="missed">missed ${e.count}×</span>
        </li>`).join('') + '</ul>';

  document.getElementById('card-area').innerHTML = `
    <div class="done-msg">
      <h2>Round complete!</h2>
      <p>You scored <strong>${score} / ${SESSION_TARGET}</strong> &nbsp;(${pct}%)</p>
      <div>${hardHTML}</div>
      <button class="btn btn-primary" onclick="restart()">Another round</button>
    </div>
  `;
}

function renderConjugations() {
  const card = document.getElementById('card-area');
  const conj = CONJUGATIONS[activeVerbIndex];

  const verbBtns = CONJUGATIONS.map((c, i) =>
    `<button class="chip${i === activeVerbIndex ? ' active' : ''}" style="border-radius:8px" onclick="setVerb(${i})">${c.verb}</button>`
  ).join('');

  const rows = conj.forms.map((f, i) => `
    <tr>
      <td>${f.pronoun}</td>
      <td><input class="fill-input" id="fill-${i}" placeholder="type form…" autocomplete="off" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter')checkFills()"></td>
      <td id="hint-${i}" style="color:var(--text-muted);font-size:0.82rem"></td>
    </tr>
  `).join('');

  card.innerHTML = `
    <div class="question-label">Conjugations</div>
    <div class="chip-row" style="margin-bottom:16px">${verbBtns}</div>
    <div class="conj-intro">Fill in all forms of <strong>${conj.verb}</strong> (${conj.english}):</div>
    <table class="conj-table">
      <thead><tr><th>Pronoun</th><th>Your answer</th><th>Hint</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="conj-actions">
      <button class="btn btn-primary" onclick="checkFills()">Check</button>
      <button class="btn btn-ghost" onclick="showAll()">Show answers</button>
    </div>
    <div class="feedback" id="conj-feedback" style="margin-top:12px"></div>
  `;
}

function setVerb(i) { activeVerbIndex = i; renderConjugations(); }

function checkFills() {
  const conj = CONJUGATIONS[activeVerbIndex];
  let correct = 0;
  conj.forms.forEach((f, i) => {
    const input = document.getElementById(`fill-${i}`);
    const val = input.value.trim().toLowerCase();
    input.classList.remove('correct', 'wrong');
    if (val === f.form.toLowerCase()) { input.classList.add('correct'); correct++; }
    else { input.classList.add('wrong'); document.getElementById(`hint-${i}`).textContent = f.form; }
  });
  const fb = document.getElementById('conj-feedback');
  if (correct === conj.forms.length) {
    fb.textContent = 'Perfect! All forms correct.';
    fb.className = 'feedback correct';
  } else {
    fb.textContent = `${correct} of ${conj.forms.length} correct. Wrong answers shown above.`;
    fb.className = 'feedback wrong';
  }
}

function showAll() {
  CONJUGATIONS[activeVerbIndex].forms.forEach((f, i) => {
    const input = document.getElementById(`fill-${i}`);
    input.value = f.form;
    input.classList.add('correct');
    input.classList.remove('wrong');
  });
}

function updateScore() {
  document.getElementById('score-display').innerHTML =
    `Correct: <strong>${score}</strong> &nbsp;|&nbsp; Question <strong>${Math.min(sessionCount, SESSION_TARGET)}</strong> of ${SESSION_TARGET}`;
}

function toggleFilters() {
  const row = document.getElementById('cat-controls');
  const arrow = document.getElementById('filter-arrow');
  const open = row.style.display === 'none';
  row.style.display = open ? 'flex' : 'none';
  arrow.textContent = open ? '▴' : '▾';
}

function setMode(m, btn) {
  mode = m;
  document.querySelectorAll('.mode-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const catControls = document.getElementById('cat-controls');
  const filterHeader = document.getElementById('cat-filter-header');
  const scoreRow = document.getElementById('score-row');
  if (m === 'conj') {
    filterHeader.style.display = 'none';
    catControls.style.display = 'none';
    scoreRow.style.display = 'none';
    renderConjugations();
  } else {
    filterHeader.style.display = 'flex';
    scoreRow.style.display = 'flex';
    buildDeck(); renderQuestion();
  }
}

function restart() {
  if (mode === 'conj') { renderConjugations(); return; }
  buildDeck(); renderQuestion();
}

function buildCatControls() {
  const div = document.getElementById('cat-controls');
  CATEGORIES.forEach(cat => {
    const b = document.createElement('button');
    b.className = 'chip' + (cat === 'all' ? ' active' : '');
    b.textContent = LABELS[cat];
    b.onclick = () => {
      activeCategory = cat;
      document.querySelectorAll('#cat-controls .chip').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      document.getElementById('filter-label').textContent = LABELS[cat];
      buildDeck(); renderQuestion();
    };
    div.appendChild(b);
  });
}

buildCatControls();
buildDeck();
renderQuestion();
</script>
</body>
</html>
