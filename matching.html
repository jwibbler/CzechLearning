<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>Matching — Czech Practice</title>
<style>
.score-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.score-info { font-size: 0.82rem; color: var(--text-muted); }

.columns { display: flex; gap: 8px; align-items: flex-start; position: relative; }
.col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }

.col-label {
  font-size: 0.67rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  padding-bottom: 4px;
}
.item {
  background: var(--surface);
  border-radius: 9px;
  padding: 10px 12px;
  border: 1.5px solid var(--border);
  font-size: 0.82rem;
  color: var(--text);
  line-height: 1.35;
  transition: border-color 0.15s, background 0.15s;
  min-height: 44px;
  display: flex;
  align-items: center;
  user-select: none;
  -webkit-user-select: none;
}
.item[data-qindex] { cursor: grab; touch-action: none; }
.item[data-qindex]:active { cursor: grabbing; }
.item[data-aindex] { cursor: default; }
.item.selected { border-color: var(--accent); background: var(--accent-light); }
.item.drag-over { border-color: var(--accent); background: var(--accent-light); transform: scale(1.02); }
.item.dragging { opacity: 0.3; }
.item.matched { border-color: var(--success); background: var(--success-bg); color: var(--success); }
.item.wrong { border-color: var(--danger); background: var(--danger-bg); animation: shake 0.35s ease; }

.drag-ghost {
  position: fixed;
  pointer-events: none;
  z-index: 1000;
  opacity: 0.9;
  transform: scale(1.05) rotate(1deg);
  box-shadow: 0 8px 28px rgba(0,0,0,0.4);
  border-color: var(--accent) !important;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

.result-banner {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  text-align: center;
  display: none;
  margin-top: 20px;
  box-shadow: var(--shadow);
}
.result-banner h2 { color: var(--success); font-size: 1.3rem; margin-bottom: 6px; }
.result-banner p { color: var(--text-muted); margin-bottom: 16px; font-size: 0.88rem; }
</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">🇨🇿 Czech Practice</a>
  <a href="flashcards.html" class="nav-link">Flashcards</a>
  <a href="matching.html" class="nav-link active">Matching</a>
  <a href="quiz.html" class="nav-link">Quiz</a>
  <button class="theme-btn" id="theme-btn" onclick="toggleTheme()">☀️</button>
</nav>

<div class="page">
  <div class="filter-header">
    <button class="filter-toggle-btn" id="filter-toggle-btn" onclick="toggleFilters()">
      Set: <span id="filter-label">…</span> <span class="arrow" id="filter-arrow">▾</span>
    </button>
  </div>
  <div class="chip-row" id="set-tabs" style="display:none"></div>

  <div class="score-bar">
    <div class="score-info" id="score-info">Drag a question onto its answer</div>
    <button class="btn btn-ghost" onclick="resetSet()">Reset</button>
  </div>

  <div class="columns" id="columns">
    <div class="peek-tooltip" id="match-peek"></div>
    <div class="col" id="q-col"><div class="col-label">Questions</div></div>
    <div class="col" id="a-col"><div class="col-label">Answers</div></div>
  </div>

  <div class="result-banner" id="result-banner">
    <h2>Well done! 🎉</h2>
    <p id="result-msg"></p>
    <button class="btn btn-success" id="next-set-btn" onclick="goNextSet()">Next set →</button>
  </div>
</div>

<script src="data.js"></script>
<script>
(function() {
  const saved = localStorage.getItem('theme') || 'dark';
  document.documentElement.dataset.theme = saved;
  document.getElementById('theme-btn').textContent = saved === 'dark' ? '☀️' : '🌙';
})();
function toggleTheme() {
  const html = document.documentElement;
  const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
  html.dataset.theme = next;
  localStorage.setItem('theme', next);
  document.getElementById('theme-btn').textContent = next === 'dark' ? '☀️' : '🌙';
}

let activeSet = 0;
let selectedQ = null;
let matched = 0;
let wrong = 0;
let answers = [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function toggleFilters() {
  const row = document.getElementById('set-tabs');
  const arrow = document.getElementById('filter-arrow');
  const open = row.style.display === 'none';
  row.style.display = open ? 'flex' : 'none';
  arrow.textContent = open ? '▴' : '▾';
}

function buildTabs() {
  const div = document.getElementById('set-tabs');
  div.innerHTML = '';
  MATCHING_SETS.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'chip' + (i === activeSet ? ' active-green' : '');
    b.textContent = s.title;
    b.onclick = () => { activeSet = i; buildTabs(); loadSet(); };
    div.appendChild(b);
  });
  document.getElementById('filter-label').textContent = MATCHING_SETS[activeSet].title;
}

function loadSet() {
  const set = MATCHING_SETS[activeSet];
  matched = 0; wrong = 0; selectedQ = null;
  answers = shuffle(set.pairs.map((p, i) => ({ text: p.a, index: i })));
  renderGrid();
  document.getElementById('result-banner').style.display = 'none';
  updateScore();
}

function renderGrid() {
  const set = MATCHING_SETS[activeSet];
  const qcol = document.getElementById('q-col');
  const acol = document.getElementById('a-col');
  qcol.innerHTML = '<div class="col-label">Questions</div>';
  acol.innerHTML = '<div class="col-label">Answers</div>';

  set.pairs.forEach((pair, i) => {
    const el = document.createElement('div');
    el.className = 'item';
    el.dataset.qindex = i;
    el.textContent = pair.q;
    initDrag(el, i);
    initMatchPeek(el, pair.a);
    qcol.appendChild(el);
  });

  answers.forEach((ans, i) => {
    const el = document.createElement('div');
    el.className = 'item';
    el.dataset.aindex = i;
    el.textContent = ans.text;
    el.addEventListener('click', () => selectAnswer(i));
    acol.appendChild(el);
  });
}

function getQEl(i) { return document.querySelector(`.item[data-qindex="${i}"]`); }
function getAEl(i) { return document.querySelector(`.item[data-aindex="${i}"]`); }

function initMatchPeek(el, correctAnswer) {
  const tooltip = document.getElementById('match-peek');
  let peekTimer = null, isPeeking = false, ptrMoved = false, ptrStartX = 0, ptrStartY = 0;
  el.addEventListener('pointerdown', e => {
    if (el.classList.contains('matched')) return;
    ptrMoved = false; ptrStartX = e.clientX; ptrStartY = e.clientY;
    peekTimer = setTimeout(() => {
      if (!ptrMoved) {
        tooltip.textContent = correctAnswer;
        tooltip.classList.add('visible');
        isPeeking = true;
      }
    }, 400);
  });
  el.addEventListener('pointermove', e => {
    if (Math.hypot(e.clientX - ptrStartX, e.clientY - ptrStartY) > 8) {
      ptrMoved = true;
      if (!isPeeking) clearTimeout(peekTimer);
    }
  });
  const endPeek = () => {
    clearTimeout(peekTimer);
    tooltip.classList.remove('visible');
    isPeeking = false;
  };
  el.addEventListener('pointerup', endPeek);
  el.addEventListener('pointercancel', endPeek);
}

// ── Drag-to-match ──
let dragState = null;

function initDrag(el, qIndex) {
  el.addEventListener('pointerdown', e => {
    if (el.classList.contains('matched')) return;
    e.preventDefault();
    const rect = el.getBoundingClientRect();
    dragState = {
      qIndex, el,
      startX: e.clientX, startY: e.clientY,
      offsetX: e.clientX - rect.left,
      offsetY: e.clientY - rect.top,
      width: rect.width,
      ghost: null,
      moved: false
    };
    document.addEventListener('pointermove', onDragMove, { passive: false });
    document.addEventListener('pointerup', onDragEnd);
  });
}

function onDragMove(e) {
  if (!dragState) return;
  e.preventDefault();
  const dx = e.clientX - dragState.startX;
  const dy = e.clientY - dragState.startY;

  if (!dragState.moved && Math.hypot(dx, dy) > 6) {
    dragState.moved = true;
    const g = dragState.el.cloneNode(true);
    g.classList.add('drag-ghost');
    g.style.width = dragState.width + 'px';
    g.style.left = (dragState.startX - dragState.offsetX) + 'px';
    g.style.top  = (dragState.startY - dragState.offsetY) + 'px';
    document.body.appendChild(g);
    dragState.ghost = g;
    dragState.el.classList.add('dragging');
    // deselect any tap-selected question
    if (selectedQ !== null) { getQEl(selectedQ).classList.remove('selected'); selectedQ = null; }
  }

  if (dragState.moved && dragState.ghost) {
    dragState.ghost.style.left = (e.clientX - dragState.offsetX) + 'px';
    dragState.ghost.style.top  = (e.clientY - dragState.offsetY) + 'px';

    // highlight answer under cursor
    dragState.ghost.style.visibility = 'hidden';
    const target = document.elementFromPoint(e.clientX, e.clientY);
    dragState.ghost.style.visibility = '';
    document.querySelectorAll('.item[data-aindex]').forEach(a => a.classList.remove('drag-over'));
    const ael = target ? target.closest('.item[data-aindex]') : null;
    if (ael && !ael.classList.contains('matched')) ael.classList.add('drag-over');
  }
}

function onDragEnd(e) {
  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup', onDragEnd);
  document.querySelectorAll('.item[data-aindex]').forEach(a => a.classList.remove('drag-over'));

  if (!dragState) return;

  if (dragState.ghost) {
    dragState.ghost.remove();
    dragState.el.classList.remove('dragging');
  }

  if (dragState.moved) {
    dragState.ghost = null;
    dragState.ghost; // no-op, ghost already removed
    const target = document.elementFromPoint(e.clientX, e.clientY);
    const ael = target ? target.closest('.item[data-aindex]') : null;
    if (ael) doMatch(parseInt(ael.dataset.aindex), dragState.qIndex);
  } else {
    // short tap — select/deselect question
    selectQuestion(dragState.qIndex);
  }

  dragState = null;
}

function selectQuestion(i) {
  const el = getQEl(i);
  if (!el || el.classList.contains('matched')) return;
  if (selectedQ === i) { el.classList.remove('selected'); selectedQ = null; return; }
  if (selectedQ !== null) getQEl(selectedQ).classList.remove('selected');
  selectedQ = i;
  el.classList.add('selected');
}

function selectAnswer(aPos) {
  if (selectedQ === null) return;
  doMatch(aPos, selectedQ);
}

function doMatch(aPos, qIdx) {
  const ans = answers[aPos];
  const ael = getAEl(aPos);
  const qel = getQEl(qIdx);
  if (!ael || ael.classList.contains('matched')) return;
  if (!qel || qel.classList.contains('matched')) return;

  const correctPair = MATCHING_SETS[activeSet].pairs[qIdx];
  if (ans.text === correctPair.a) {
    qel.classList.remove('selected');
    qel.classList.add('matched');
    ael.classList.add('matched');
    matched++;
    selectedQ = null;
    updateScore();
    if (matched === MATCHING_SETS[activeSet].pairs.length) showResult();
  } else {
    wrong++;
    ael.classList.add('wrong');
    setTimeout(() => ael.classList.remove('wrong'), 500);
    updateScore();
  }
}

function updateScore() {
  const total = MATCHING_SETS[activeSet].pairs.length;
  document.getElementById('score-info').textContent =
    `Matched: ${matched} / ${total}  ·  Wrong: ${wrong}`;
}

function showResult() {
  const banner = document.getElementById('result-banner');
  banner.style.display = 'block';
  const total = MATCHING_SETS[activeSet].pairs.length;
  document.getElementById('result-msg').textContent =
    wrong === 0
      ? `Perfect — all ${total} pairs with no mistakes!`
      : `All ${total} pairs matched (${wrong} wrong attempt${wrong !== 1 ? 's' : ''}).`;
  const nextBtn = document.getElementById('next-set-btn');
  nextBtn.style.display = activeSet < MATCHING_SETS.length - 1 ? 'inline-block' : 'none';
}

function goNextSet() {
  activeSet++;
  buildTabs();
  loadSet();
  document.getElementById('result-banner').style.display = 'none';
}

function resetSet() { loadSet(); }

buildTabs();
loadSet();
</script>
</body>
</html>
