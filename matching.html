<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matching — Czech Practice</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: #f1f5f9; min-height: 100vh; padding: 24px 20px; }
header { display: flex; align-items: center; gap: 16px; max-width: 900px; margin: 0 auto 24px; }
header a { color: #3b82f6; text-decoration: none; font-size: 0.9rem; }
header h1 { font-size: 1.4rem; color: #1e293b; }

.set-tabs { max-width: 900px; margin: 0 auto 24px; display: flex; flex-wrap: wrap; gap: 8px; }
.tab-btn {
  padding: 7px 16px; border-radius: 8px; border: 2px solid #e2e8f0;
  background: white; cursor: pointer; font-size: 0.85rem; color: #475569;
  transition: all 0.15s;
}
.tab-btn.active { background: #22c55e; border-color: #22c55e; color: white; }
.tab-btn:hover:not(.active) { border-color: #22c55e; color: #22c55e; }

.score-bar { max-width: 900px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: space-between; }
.score-info { font-size: 0.9rem; color: #64748b; }
.reset-btn {
  padding: 7px 18px; border-radius: 8px; border: none;
  background: #e2e8f0; cursor: pointer; font-size: 0.85rem; color: #475569;
  transition: background 0.15s;
}
.reset-btn:hover { background: #cbd5e1; }

.columns { max-width: 900px; margin: 0 auto; display: flex; gap: 16px; align-items: flex-start; }
.col { flex: 1; display: flex; flex-direction: column; gap: 10px; }
@media (max-width: 600px) { .columns { flex-direction: column; } }

.col-label { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #94a3b8; padding: 0 4px 8px; }
.item {
  background: white;
  border-radius: 10px;
  padding: 14px 18px;
  cursor: pointer;
  border: 2px solid #e2e8f0;
  font-size: 0.9rem;
  color: #1e293b;
  line-height: 1.4;
  transition: border-color 0.15s, background 0.15s;
  min-height: 56px;
  display: flex;
  align-items: center;
}
.item:hover:not(.matched):not(.wrong) { border-color: #22c55e; }
.item.selected { border-color: #3b82f6; background: #eff6ff; }
.item.matched { border-color: #22c55e; background: #f0fdf4; color: #15803d; cursor: default; }
.item.wrong { border-color: #ef4444; background: #fef2f2; animation: shake 0.35s ease; }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  60% { transform: translateX(6px); }
}

.result-banner {
  max-width: 900px; margin: 24px auto 0;
  background: white; border-radius: 12px; padding: 24px 28px;
  text-align: center; display: none;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.result-banner h2 { color: #15803d; font-size: 1.5rem; margin-bottom: 8px; }
.result-banner p { color: #64748b; margin-bottom: 16px; }
.next-btn {
  padding: 10px 28px; border-radius: 8px; border: none;
  background: #22c55e; cursor: pointer; font-size: 0.95rem; color: white;
  font-weight: 500; transition: background 0.15s;
}
.next-btn:hover { background: #16a34a; }
</style>
</head>
<body>
<header>
  <a href="index.html">← Back</a>
  <h1>Matching</h1>
</header>

<div class="set-tabs" id="set-tabs"></div>

<div class="score-bar">
  <div class="score-info" id="score-info">Match each question to its answer</div>
  <button class="reset-btn" onclick="resetSet()">Reset</button>
</div>

<div class="columns">
  <div class="col" id="q-col"><div class="col-label">Questions</div></div>
  <div class="col" id="a-col"><div class="col-label">Answers</div></div>
</div>
<div class="result-banner" id="result-banner">
  <h2>Well done!</h2>
  <p id="result-msg"></p>
  <button class="next-btn" id="next-set-btn" onclick="goNextSet()">Next set</button>
</div>

<script src="data.js"></script>
<script>
let activeSet = 0;
let selectedQ = null;
let matched = 0;
let wrong = 0;
let answers = [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildTabs() {
  const div = document.getElementById('set-tabs');
  div.innerHTML = '';
  MATCHING_SETS.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'tab-btn' + (i === activeSet ? ' active' : '');
    b.textContent = s.title;
    b.onclick = () => { activeSet = i; buildTabs(); loadSet(); };
    div.appendChild(b);
  });
}

function loadSet() {
  const set = MATCHING_SETS[activeSet];
  matched = 0;
  wrong = 0;
  selectedQ = null;
  answers = shuffle(set.pairs.map((p, i) => ({ text: p.a, index: i, matched: false })));
  renderGrid();
  document.getElementById('result-banner').style.display = 'none';
  updateScore();
}

function renderGrid() {
  const set = MATCHING_SETS[activeSet];
  const qcol = document.getElementById('q-col');
  const acol = document.getElementById('a-col');
  qcol.innerHTML = '<div class="col-label">Questions</div>';
  acol.innerHTML = '<div class="col-label">Answers</div>';

  set.pairs.forEach((pair, i) => {
    const qel = document.createElement('div');
    qel.className = 'item';
    qel.dataset.qindex = i;
    qel.textContent = pair.q;
    qel.onclick = () => selectQuestion(i);
    qcol.appendChild(qel);
  });

  answers.forEach((ans, i) => {
    const ael = document.createElement('div');
    ael.className = 'item';
    ael.dataset.aindex = i;
    ael.textContent = ans.text;
    ael.onclick = () => selectAnswer(i);
    acol.appendChild(ael);
  });
}

function getQEl(i) { return document.querySelector(`.item[data-qindex="${i}"]`); }
function getAEl(i) { return document.querySelector(`.item[data-aindex="${i}"]`); }

function selectQuestion(i) {
  const el = getQEl(i);
  if (el.classList.contains('matched')) return;
  if (selectedQ === i) { el.classList.remove('selected'); selectedQ = null; return; }
  if (selectedQ !== null) getQEl(selectedQ).classList.remove('selected');
  selectedQ = i;
  el.classList.add('selected');
}

function selectAnswer(aPos) {
  if (selectedQ === null) return;
  const ans = answers[aPos];
  const ael = getAEl(aPos);
  const qel = getQEl(selectedQ);
  if (ael.classList.contains('matched')) return;

  const correctPair = MATCHING_SETS[activeSet].pairs[selectedQ];
  if (ans.text === correctPair.a) {
    qel.classList.remove('selected');
    qel.classList.add('matched');
    ael.classList.add('matched');
    matched++;
    selectedQ = null;
    updateScore();
    if (matched === MATCHING_SETS[activeSet].pairs.length) showResult();
  } else {
    wrong++;
    ael.classList.add('wrong');
    setTimeout(() => ael.classList.remove('wrong'), 500);
    updateScore();
  }
}

function updateScore() {
  const total = MATCHING_SETS[activeSet].pairs.length;
  document.getElementById('score-info').textContent =
    `Matched: ${matched} / ${total}  |  Wrong attempts: ${wrong}`;
}

function showResult() {
  const banner = document.getElementById('result-banner');
  banner.style.display = 'block';
  const total = MATCHING_SETS[activeSet].pairs.length;
  document.getElementById('result-msg').textContent =
    wrong === 0
      ? `Perfect — all ${total} pairs matched with no mistakes!`
      : `All ${total} pairs matched (${wrong} wrong attempt${wrong !== 1 ? 's' : ''}).`;
  const nextBtn = document.getElementById('next-set-btn');
  nextBtn.style.display = activeSet < MATCHING_SETS.length - 1 ? 'inline-block' : 'none';
}

function goNextSet() {
  activeSet++;
  buildTabs();
  loadSet();
  document.getElementById('result-banner').style.display = 'none';
}

function resetSet() { loadSet(); }

buildTabs();
loadSet();
</script>
</body>
</html>
